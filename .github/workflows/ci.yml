name: producer-service - test y deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: producer-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias y de integración con cobertura
        run: npm run test:coverage
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-producer-service
          path: coverage/
          if-no-files-found: warn

  deploy:
    name: Deploy en Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL (Render > Settings > Deploy Hook)"
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
